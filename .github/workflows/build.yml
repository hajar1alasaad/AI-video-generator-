name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade buildozer Cython

    - name: Create Buildozer Spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = VideoGenApp
        package.name = videogenapp
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,html,txt
        version = 0.1
        requirements = python3,kivy,flask,gTTS,moviepy
        orientation = portrait
        osx.kivy_version = 2.2.1
        fullscreen = 0
        android.archs = arm64-v8a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
